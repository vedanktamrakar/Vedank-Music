<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Downloader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%); padding: 20px;
    }
    .card {
      background: #fff; width: 100%; max-width: 560px; border-radius: 24px;
      padding: 32px 28px 28px; box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    .card h1 { font-size: 1.6rem; color: #0f172a; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
    .card h1 span { font-size: 1.9rem; }
    .subtitle { font-size: 0.9rem; color: #64748b; margin-bottom: 24px; border-left: 3px solid #3b82f6; padding-left: 12px; }
    .input-group { position: relative; margin-bottom: 20px; }
    .input-group input {
      width: 100%; padding: 15px 18px; font-size: 1rem; border: 2px solid #e2e8f0;
      border-radius: 14px; outline: none; transition: 0.2s; background: #f8fafc; color: #0f172a;
    }
    .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59,130,246,0.15); background: #fff; }
    .platform-badge {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      font-size: 0.75rem; font-weight: 600; padding: 4px 10px; border-radius: 20px;
      background: #e2e8f0; color: #475569; opacity: 0; transition: 0.2s;
    }
    .platform-badge.visible { opacity: 1; }
    .toggle-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .toggle-btn {
      flex: 1; padding: 13px 10px; border: 2px solid #e2e8f0; border-radius: 14px;
      background: #f8fafc; font-size: 0.95rem; font-weight: 600; color: #64748b;
      cursor: pointer; transition: 0.2s; display: flex; align-items: center;
      justify-content: center; gap: 8px; user-select: none;
    }
    .toggle-btn.active { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .toggle-btn:hover:not(.active) { border-color: #cbd5e1; background: #f1f5f9; }
    .options-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .option-box { background: #f8fafc; border-radius: 14px; padding: 14px 16px; border: 2px solid #e2e8f0; }
    .option-box label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: #64748b; margin-bottom: 8px; }
    .option-box select {
      width: 100%; padding: 10px 12px; font-size: 0.95rem; border: 1.5px solid #cbd5e1;
      border-radius: 10px; background: #fff; color: #0f172a; outline: none; cursor: pointer;
    }
    .option-box select:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-download {
      width: 100%; padding: 16px; border: none; border-radius: 14px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: #fff;
      font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px;
    }
    .btn-download:hover:not(:disabled) { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); transform: translateY(-2px); box-shadow: 0 12px 25px rgba(37,99,235,0.4); }
    .btn-download:disabled { opacity: 0.6; cursor: not-allowed; }
    .spinner {
      width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
    }
    .btn-download.loading .spinner { display: block; }
    .btn-download.loading .btn-text { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 0.9rem; text-align: center; min-height: 24px; padding: 10px 14px; border-radius: 12px; transition: 0.3s; word-break: break-word; }
    .status.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .status.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .status.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    @media (max-width: 480px) {
      .card { padding: 24px 18px; }
      .options-row { grid-template-columns: 1fr; }
      .card h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span>⬇️</span> Media Downloader</h1>
    <p class="subtitle">
      Paste a link from <strong>YouTube, Instagram, Facebook, or Snapchat</strong>
      and download it as video or audio in your preferred format and quality.
    </p>

    <div class="input-group">
      <input type="url" id="mediaUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" />
      <span class="platform-badge" id="platformBadge"></span>
    </div>

    <div class="toggle-group">
      <div class="toggle-btn active" data-type="video" id="toggleVideo">🎬 Video</div>
      <div class="toggle-btn" data-type="audio" id="toggleAudio">🎵 Audio</div>
    </div>

    <div class="options-row">
      <div class="option-box">
        <label for="formatSelect">File Format</label>
        <select id="formatSelect"></select>
      </div>
      <div class="option-box">
        <label for="qualitySelect">Quality</label>
        <select id="qualitySelect"></select>
      </div>
    </div>

    <button class="btn-download" id="downloadBtn">
      <span class="spinner"></span>
      <span class="btn-text">⬇️ Download</span>
    </button>

    <div class="status" id="statusMsg"></div>
  </div>

  <script>
    (function () {
      "use strict";

      const mediaUrlInput = document.getElementById("mediaUrl");
      const platformBadge = document.getElementById("platformBadge");
      const toggleVideo   = document.getElementById("toggleVideo");
      const toggleAudio   = document.getElementById("toggleAudio");
      const formatSelect  = document.getElementById("formatSelect");
      const qualitySelect = document.getElementById("qualitySelect");
      const downloadBtn   = document.getElementById("downloadBtn");
      const statusMsg     = document.getElementById("statusMsg");

      let currentType = "video";

      const FORMATS = {
        video: [
          { value: "mp4",  label: "MP4 (H.264)" },
          { value: "webm", label: "WebM" },
        ],
        audio: [
          { value: "mp3",  label: "MP3" },
          { value: "ogg",  label: "OGG" },
          { value: "wav",  label: "WAV" },
          { value: "opus", label: "OPUS" },
          { value: "best", label: "Best Available" },
        ],
      };

      const QUALITIES = {
        video: [
          { value: "144",  label: "144p" },
          { value: "240",  label: "240p" },
          { value: "360",  label: "360p" },
          { value: "480",  label: "480p" },
          { value: "720",  label: "720p (HD)" },
          { value: "1080", label: "1080p (Full HD)" },
          { value: "1440", label: "1440p (2K)" },
          { value: "2160", label: "2160p (4K)" },
          { value: "max",  label: "Max Available" },
        ],
        audio: [{ value: "best", label: "Best Available" }],
      };

      function populateSelect(el, opts) {
        el.innerHTML = "";
        opts.forEach((o) => {
          const op = document.createElement("option");
          op.value = o.value;
          op.textContent = o.label;
          el.appendChild(op);
        });
      }

      function refreshFormats() {
        populateSelect(formatSelect, FORMATS[currentType]);
        populateSelect(qualitySelect, QUALITIES[currentType]);
        qualitySelect.disabled = currentType === "audio";
      }

      function setType(type) {
        currentType = type;
        toggleVideo.classList.toggle("active", type === "video");
        toggleAudio.classList.toggle("active", type === "audio");
        refreshFormats();
      }

      toggleVideo.addEventListener("click", () => setType("video"));
      toggleAudio.addEventListener("click", () => setType("audio"));
      setType("video");

      function detectPlatform(url) {
        if (!url) return null;
        const l = url.toLowerCase();
        if (l.includes("youtube.com") || l.includes("youtu.be")) return { name: "YouTube", emoji: "▶️" };
        if (l.includes("instagram.com")) return { name: "Instagram", emoji: "📸" };
        if (l.includes("facebook.com") || l.includes("fb.watch")) return { name: "Facebook", emoji: "📘" };
        if (l.includes("snapchat.com")) return { name: "Snapchat", emoji: "👻" };
        return { name: "Unknown", emoji: "🌐" };
      }

      mediaUrlInput.addEventListener("input", () => {
        const p = detectPlatform(mediaUrlInput.value.trim());
        if (p) {
          platformBadge.textContent = p.emoji + " " + p.name;
          platformBadge.classList.add("visible");
        } else {
          platformBadge.classList.remove("visible");
        }
      });

      function showStatus(msg, type = "info") {
        statusMsg.textContent = msg;
        statusMsg.className = "status " + type;
      }
      function clearStatus() {
        statusMsg.textContent = "";
        statusMsg.className = "status";
      }

      function triggerDownload(url, filename) {
        const a = document.createElement("a");
        a.href = url;
        if (filename) a.download = filename;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      async function handleDownload() {
        clearStatus();
        const url = mediaUrlInput.value.trim();

        if (!url) {
          showStatus("⚠️ Please paste a media link first.", "error");
          mediaUrlInput.focus();
          return;
        }
        try { new URL(url); }
        catch { showStatus("⚠️ Invalid URL.", "error"); return; }

        const platform = detectPlatform(url);
        if (platform.name === "Unknown") {
          showStatus("⚠️ Link is not YouTube/Instagram/Facebook/Snapchat, but trying anyway…", "info");
        }

        downloadBtn.disabled = true;
        downloadBtn.classList.add("loading");
        showStatus("⏳ Processing your link… please wait.", "info");

        try {
          const requestBody = {
            url,
            type: currentType,
            format: formatSelect.value,
            quality: qualitySelect.value,
          };

          // ✅ Same-origin call to our Vercel serverless function
          const response = await fetch("/api/download", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(requestBody),
          });

          const data = await response.json();

          if (data.status === "success" || data.status === "redirect") {
            if (data.url) {
              showStatus("✅ Download ready! Opening your file…", "success");
              triggerDownload(data.url, data.filename || null);
            } else {
              showStatus("⚠️ No download URL returned.", "error");
            }
          } else if (data.status === "stream") {
            if (data.url) {
              showStatus("✅ Live stream ready! Opening…", "success");
              window.open(data.url, "_blank", "noopener,noreferrer");
            } else {
              showStatus("⚠️ Stream URL missing.", "error");
            }
          } else if (data.status === "picker") {
            if (Array.isArray(data.picker) && data.picker.length > 0) {
              const first = data.picker[0];
              if (first.url) {
                showStatus("✅ Media found! Downloading first item…", "success");
                triggerDownload(first.url, first.filename || null);
         d     } else {
                showStatus("⚠️ Picker item has no URL.", "error");
              }
            } else {
              showStatus("⚠️ Picker list is empty.", "error");
            }
          } else if (data.status === "rate-limit") {
            showStatus("🚦 Rate limit reached. Please wait and try again.", "error");
          } else if (data.status === "error") {
            showStatus("❌ " + (data.text || "Server could not process this link."), "error");
          } else {
            showStatus("⚠️ Unexpected response from server.", "error");
          }
        } catch (err) {
          console.error(err);
          showStatus("❌ " + (err.message || "Network error. Please try again."), "error");
        } finally {
          downloadBtn.disabled = false;
          downloadBtn.classList.remove("loading");
        }
      }

      downloadBtn.addEventListener("click", handleDownload);
      mediaUrlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); handleDownload(); }
      });
    })();
  </script>
</body>
</html>
