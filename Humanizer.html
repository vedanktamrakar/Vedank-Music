<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vedank Music — Audio Humanizer</title>
<style>
  :root{--bg:#0a0a0a;--card:#151515;--accent:#00ff88;--text:#e0e0e0;--muted:#888;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{padding:20px;text-align:center;border-bottom:1px solid #222}
  h1{margin:0;font-size:1.5rem;color:var(--accent)}
  main{max-width:1000px;margin:0 auto;padding:20px}
  .card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid #222}
  .card h2{margin-top:0;font-size:1.1rem;color:var(--accent)}
  .upload{border:2px dashed #333;border-radius:8px;padding:30px;text-align:center;cursor:pointer;transition:.2s}
  .upload:hover{border-color:var(--accent)}
  .upload input{display:none}
  canvas{width:100%;background:#000;border-radius:6px;display:block}
  #stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:15px}
  .stat{background:#111;padding:10px;border-radius:6px}
  .stat label{display:block;font-size:.75rem;color:var(--muted)}
  .stat value{font-size:1rem;color:var(--accent);font-weight:600}
  .options{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:10px;padding:10px;background:#111;border-radius:6px}
  .opt input{accent-color:var(--accent);width:18px;height:18px}
  .opt.disabled{opacity:.4}
  .opt .desc{font-size:.8rem;color:var(--muted)}
  button{background:var(--accent);color:#000;border:none;padding:12px 24px;border-radius:6px;cursor:pointer;font-weight:600;font-size:1rem}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.secondary{background:#333;color:var(--text)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
  #status{margin-top:15px;font-size:.9rem;color:var(--muted)}
  .success{color:var(--accent)}.error{color:#ff5555}.warning{color:#ffaa00}
  .hidden{display:none}
</style>
</head>
<body>
<!--
  ⚠️ AUTH: Agar Firebase auth chahiye, yahan apna guard lagao:
  <script type="module">
    import { getAuth, onAuthStateChanged } from "firebase/auth";
    import { app } from "./firebase-config.js";
    onAuthStateChanged(getAuth(app), u => { if(!u) location.href="/login.html"; });
  </script>
-->
<header>
  <h1>🎵 Vedank Music — Audio Humanizer</h1>
  <p style="margin:5px 0 0;color:#888;font-size:.85rem">100% browser-based — koi file server par nahi jaati</p>
</header>

<main>
  <div class="card">
    <h2>1. Audio Upload</h2>
    <label class="upload" id="uploadLabel">
      <input type="file" id="fileInput" accept=".wav,.mp3,audio/wav,audio/mpeg">
      <div>📁 WAV ya MP3 file chunein</div>
      <div style="font-size:.8rem;color:#666;margin-top:5px" id="fileName">Koi file nahi chuni</div>
    </label>
  </div>

  <div class="card hidden" id="analysisCard">
    <h2>2. Analysis (asli data se)</h2>
    <canvas id="waveform" height="100"></canvas>
    <div style="margin-top:10px">
      <label style="font-size:.8rem;color:#888">Frequency Spectrum (0–22 kHz)</label>
      <canvas id="spectrum" height="200"></canvas>
    </div>
    <div id="stats"></div>
  </div>

  <div class="card hidden" id="optionsCard">
    <h2>3. Humanization Options</h2>
    <div class="options">
      <label class="opt" id="optNotchWrap">
        <input type="checkbox" id="optNotch" checked>
        <div><div>Notch Filter @ 19.5 kHz</div>
        <div class="desc">Suno/Udio watermark hataata hai (Q=30, zero-phase)</div></div>
      </label>
      <label class="opt" id="optShelfWrap">
        <input type="checkbox" id="optShelf" checked>
        <div><div>High-Shelf Roll-off @ 15 kHz (−4 dB)</div>
        <div class="desc">AI ki digital harshness kam karta hai</div></div>
      </label>
      <label class="opt">
        <input type="checkbox" id="optWarmth" checked>
        <div><div>Warmth Boost @ 800 Hz (+2 dB)</div>
        <div class="desc">Awaaz me insaani garmahat</div></div>
      </label>
      <label class="opt">
        <input type="checkbox" id="optDither" checked>
        <div><div>Dither / Room Tone (−66 dB)</div>
        <div class="desc">Silent gaps ko natural banata hai</div></div>
      </label>
      <label class="opt">
        <input type="checkbox" id="opt22k">
        <div><div>Resample to 22.05 kHz (Nuclear Option)</div>
        <div class="desc">11 kHz upar sab cut — quality thodi kam hogi, detection bahut kam</div></div>
      </label>
    </div>
    <div class="actions"><button id="processBtn">🎧 Process & Humanize</button></div>
    <div id="status"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <h2>4. Result</h2>
    <div class="actions">
      <button class="secondary" id="playOriginalBtn">▶ Original</button>
      <button class="secondary" id="playProcessedBtn">▶ Processed</button>
      <button id="downloadBtn">⬇ Download WAV (24-bit)</button>
    </div>
    <div id="resultInfo" style="margin-top:15px;font-size:.9rem;color:#888"></div>
  </div>
</main>

<script>
let currentFile = null, originalBuffer = null, processedBuffer = null;
let decodeCtx = null, playCtx = null, currentPlaySource = null;

// ---------- FFT (radix-2, ~30 lines) ----------
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i],re[j]]=[re[j],re[i]]; [im[i],im[j]]=[im[j],im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2*Math.PI/len, wRe = Math.cos(ang), wIm = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let curRe = 1, curIm = 0;
      for (let k = 0; k < len/2; k++) {
        const uRe = re[i+k], uIm = im[i+k];
        const vRe = re[i+k+len/2]*curRe - im[i+k+len/2]*curIm;
        const vIm = re[i+k+len/2]*curIm + im[i+k+len/2]*curRe;
        re[i+k] = uRe+vRe; im[i+k] = uIm+vIm;
        re[i+k+len/2] = uRe-vRe; im[i+k+len/2] = uIm-vIm;
        const tRe = curRe*wRe - curIm*wIm;
        curIm = curRe*wIm + curIm*wRe; curRe = tRe;
      }
    }
  }
}

// ---------- File upload ----------
document.getElementById('fileInput').addEventListener('change', e => {
  const f = e.target.files[0]; if (f) loadFile(f);
});

async function loadFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['wav','mp3'].includes(ext)) {
    setStatus('❌ Sirf WAV ya MP3 support hai. Aapne diya: ' + ext, 'error'); return;
  }
  if (file.size > 50*1024*1024) setStatus('⚠️ Bada file (>50MB), thoda time lagega', 'warning');
  else setStatus('⏳ File load ho rahi hai...', '');

  document.getElementById('fileName').textContent = file.name + ' (' + (file.size/1024/1024).toFixed(2) + ' MB)';

  try {
    const ab = await file.arrayBuffer();
    if (decodeCtx) await decodeCtx.close().catch(()=>{});
    decodeCtx = new AudioContext();
    originalBuffer = await decodeCtx.decodeAudioData(ab);
    currentFile = file; processedBuffer = null;

    document.getElementById('analysisCard').classList.remove('hidden');
    document.getElementById('optionsCard').classList.remove('hidden');
    document.getElementById('resultCard').classList.add('hidden');

    drawWaveform(originalBuffer);
    drawSpectrum(originalBuffer);
    updateStats(originalBuffer);
    setStatus('✅ File ready. Options chunein aur Process dabaein.', 'success');
  } catch (err) {
    setStatus('❌ Decode fail: ' + err.message, 'error');
  }
}

// ---------- Waveform ----------
function drawWaveform(buffer) {
  const cv = document.getElementById('waveform');
  const w = cv.width = cv.clientWidth*2, h = cv.height = 200;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
  const data = buffer.getChannelData(0);
  const step = Math.max(1, Math.floor(data.length/w));
  ctx.fillStyle = '#00ff88';
  for (let x = 0; x < w; x++) {
    let mn = 1, mx = -1;
    for (let i = 0; i < step; i++) {
      const v = data[x*step+i] || 0;
      if (v<mn) mn=v; if (v>mx) mx=v;
    }
    const y1 = h/2 - mx*h/2, y2 = h/2 - mn*h/2;
    ctx.fillRect(x, y1, 1, Math.max(1, y2-y1));
  }
}

// ---------- Spectrum ----------
function drawSpectrum(buffer) {
  const cv = document.getElementById('spectrum');
  const w = cv.width = cv.clientWidth*2, h = cv.height = 400;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);

  const fftSize = 2048, nWin = 40;
  const data = buffer.getChannelData(0);
  const hop = Math.max(1, Math.floor((data.length - fftSize)/nWin));
  const avg = new Float32Array(fftSize/2);

  for (let wi = 0; wi < nWin; wi++) {
    const st = wi*hop;
    const re = new Float32Array(fftSize), im = new Float32Array(fftSize);
    for (let i = 0; i < fftSize; i++) {
      const wnd = 0.5*(1 - Math.cos(2*Math.PI*i/(fftSize-1)));
      re[i] = (data[st+i]||0) * wnd;
    }
    fft(re, im);
    for (let i = 0; i < fftSize/2; i++) avg[i] += Math.sqrt(re[i]*re[i]+im[i]*im[i]);
  }
  for (let i = 0; i < avg.length; i++) avg[i] /= nWin;

  ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 2; ctx.beginPath();
  const maxFreq = Math.min(22050, buffer.sampleRate/2);
  const nyq = buffer.sampleRate/2;
  for (let x = 0; x < w; x++) {
    const bin = Math.floor((x/w * maxFreq)/nyq * (fftSize/2));
    if (bin >= avg.length) break;
    const db = 20*Math.log10(avg[bin]+1e-9);
    const norm = Math.max(0, Math.min(1, (db+100)/100));
    const y = h - norm*h;
    if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();

  ctx.strokeStyle = '#222'; ctx.lineWidth = 1; ctx.fillStyle = '#555'; ctx.font = '20px sans-serif';
  for (let f = 0; f <= maxFreq; f += 2000) {
    const x = (f/maxFreq)*w;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke();
    ctx.fillText((f/1000)+'k', x+5, 25);
  }
}

// ---------- Stats ----------
function updateStats(buffer) {
  const ch = buffer.numberOfChannels;
  let sumSq = 0, peak = 0;
  for (let c = 0; c < ch; c++) {
    const d = buffer.getChannelData(c);
    for (let i = 0; i < d.length; i++) {
      sumSq += d[i]*d[i];
      if (Math.abs(d[i]) > peak) peak = Math.abs(d[i]);
    }
  }
  const rms = Math.sqrt(sumSq/(buffer.length*ch));
  const stats = {
    'Duration': buffer.duration.toFixed(2) + ' s',
    'Sample Rate': buffer.sampleRate + ' Hz',
    'Channels': ch===2?'Stereo':ch===1?'Mono':ch+' ch',
    'RMS': (20*Math.log10(rms)).toFixed(1) + ' dBFS',
    'Peak': (20*Math.log10(peak)).toFixed(1) + ' dBFS'
  };
  document.getElementById('stats').innerHTML = Object.entries(stats).map(([k,v]) =>
    `<div class="stat"><label>${k}</label><value>${v}</value></div>`
  ).join('');
}

// ---------- 22k option disables notch/shelf ----------
document.getElementById('opt22k').addEventListener('change', e => {
  const dis = e.target.checked;
  document.getElementById('optNotch').disabled = dis;
  document.getElementById('optShelf').disabled = dis;
  document.getElementById('optNotchWrap').classList.toggle('disabled', dis);
  document.getElementById('optShelfWrap').classList.toggle('disabled', dis);
});

// ---------- Process ----------
document.getElementById('processBtn').addEventListener('click', async () => {
  if (!originalBuffer) return;
  const opts = {
    notch: document.getElementById('optNotch').checked,
    shelf: document.getElementById('optShelf').checked,
    warmth: document.getElementById('optWarmth').checked,
    dither: document.getElementById('optDither').checked,
    resample22: document.getElementById('opt22k').checked
  };
  document.getElementById('processBtn').disabled = true;
  setStatus('⏳ Processing...', '');
  try {
    processedBuffer = await processBuffer(originalBuffer, opts);
    document.getElementById('resultCard').classList.remove('hidden');
    const bits = [];
    if (opts.notch) bits.push('Notch 19.5k');
    if (opts.shelf) bits.push('Shelf −4dB');
    if (opts.warmth) bits.push('Warmth +2dB');
    if (opts.dither) bits.push('Dither');
    if (opts.resample22) bits.push('→22.05kHz');
    document.getElementById('resultInfo').innerHTML =
      `<span class="success">✅ Applied:</span> ${bits.join(', ')}<br>` +
      `<span class="muted">Output: ${processedBuffer.sampleRate} Hz, ${processedBuffer.numberOfChannels} ch, ${processedBuffer.duration.toFixed(2)}s</span>`;
    setStatus('✅ Done. Sun kar download karein.', 'success');
  } catch (err) {
    setStatus('❌ ' + err.message, 'error');
  }
  document.getElementById('processBtn').disabled = false;
});

async function processBuffer(buffer, opts) {
  const targetSR = opts.resample22 ? 22050 : buffer.sampleRate;
  const numCh = buffer.numberOfChannels;
  const length = Math.ceil(buffer.duration * targetSR);
  const offline = new OfflineAudioContext(numCh, length, targetSR);

  const source = offline.createBufferSource();
  source.buffer = buffer;

  const filters = [];
  if (opts.notch && targetSR > 40000) {
    const n = offline.createBiquadFilter();
    n.type = 'notch'; n.frequency.value = 19500; n.Q.value = 30; filters.push(n);
  }
  if (opts.shelf && targetSR > 40000) {
    const s = offline.createBiquadFilter();
    s.type = 'highshelf'; s.frequency.value = 15000; s.gain.value = -4; filters.push(s);
  }
  if (opts.warmth) {
    const w = offline.createBiquadFilter();
    w.type = 'peaking'; w.frequency.value = 800; w.gain.value = 2; w.Q.value = 1; filters.push(w);
  }

  const mix = offline.createGain(); mix.gain.value = 1;

  let last = source;
  for (const f of filters) { last.connect(f); last = f; }
  last.connect(mix);
  mix.connect(offline.destination);

  if (opts.dither) {
    const dBuf = offline.createBuffer(numCh, length, targetSR);
    for (let c = 0; c < numCh; c++) {
      const d = dBuf.getChannelData(c);
      for (let i = 0; i < length; i++) d[i] = (Math.random()*2 - 1)*0.0005;
    }
    const dSrc = offline.createBufferSource();
    dSrc.buffer = dBuf; dSrc.connect(mix); dSrc.start(0);
  }

  source.start(0);
  return await offline.startRendering();
}

// ---------- Playback ----------
function playBuffer(buffer) {
  if (!playCtx) playCtx = new AudioContext();
  if (currentPlaySource) { try { currentPlaySource.stop(); } catch(e){} }
  const src = playCtx.createBufferSource();
  src.buffer = buffer; src.connect(playCtx.destination); src.start(0);
  currentPlaySource = src;
}
document.getElementById('playOriginalBtn').onclick = () => originalBuffer && playBuffer(originalBuffer);
document.getElementById('playProcessedBtn').onclick = () => processedBuffer && playBuffer(processedBuffer);

// ---------- WAV export (24-bit) ----------
document.getElementById('downloadBtn').onclick = () => {
  if (!processedBuffer) return;
  setStatus('⏳ WAV file ban rahi hai...', '');
  setTimeout(() => {
    try {
      const blob = audioBufferToWav(processedBuffer, 24);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'humanized_' + (currentFile?.name?.replace(/\.(wav|mp3)$/i,'') || 'audio') + '.wav';
      a.click();
      URL.revokeObjectURL(url);
      setStatus('✅ Download ready', 'success');
    } catch (e) { setStatus('❌ ' + e.message, 'error'); }
  }, 10);
};

function audioBufferToWav(buffer, bitDepth) {
  const numCh = buffer.numberOfChannels, sampleRate = buffer.sampleRate, length = buffer.length;
  const bps = bitDepth/8, blockAlign = numCh*bps, dataSize = length*blockAlign;
  const ab = new ArrayBuffer(44 + dataSize), view = new DataView(ab);
  const ws = (o,s) => { for (let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };
  ws(0,'RIFF'); view.setUint32(4, 36+dataSize, true); ws(8,'WAVE');
  ws(12,'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate*blockAlign, true); view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitDepth, true); ws(36,'data'); view.setUint32(40, dataSize, true);
  const chans = [];
  for (let c = 0; c < numCh; c++) chans.push(buffer.getChannelData(c));
  let off = 44;
  for (let i = 0; i < length; i++) {
    for (let c = 0; c < numCh; c++) {
      let s = Math.max(-1, Math.min(1, chans[c][i]));
      if (bitDepth === 24) {
        const v = Math.round(s < 0 ? s*0x800000 : s*0x7FFFFF);
        view.setUint8(off, v & 0xFF);
        view.setUint8(off+1, (v >> 8) & 0xFF);
        view.setUint8(off+2, (v >> 16) & 0xFF);
      } else {
        view.setInt16(off, s < 0 ? s*0x8000 : s*0x7FFF, true);
      }
      off += bps;
    }
  }
  return new Blob([ab], { type: 'audio/wav' });
}

// ---------- Util ----------
function setStatus(msg, cls) {
  const el = document.getElementById('status');
  if (!el) return;
  el.textContent = msg; el.className = cls || '';
}
</script>
</body>
  </html>
